<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产管理系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-page" class="login-page">
  <div class="login-box">
    <h1>生产管理系统</h1>
    <div class="sub">工序流转 · 工单管理 · 车间看板</div>
    <input id="login-user" placeholder="账号" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="primary" id="login-btn">登 录</button>
    <div class="login-tip">默认管理员：admin / admin123</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">生产管理系统</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-user"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">工作台</div>
      <div class="top-right"><span id="top-user"></span><button id="logout-btn" class="sm">退出</button></div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
